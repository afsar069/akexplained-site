media:
  input: assets
  output: /assets

content:
  - name: notes
    label: Notes & Articles
    type: collection
    path: notes
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{primary}/index.md"
      field: create
    exclude:
      - index.html
    view:
      primary: title
      fields: [title, eyebrow]
    fields:
      - name: layout
        label: Layout
        type: string
        hidden: true
        default: base.njk
      - name: title
        label: Title (the main heading of the page)
        type: string
        required: true
      - name: description
        label: Short description (shown under the heading and on Google)
        type: text
      - name: eyebrow
        label: 'Small label above the heading, for example "Notes · Literary Ages"'
        type: string
      - name: mark
        label: 'Decorative letter, for example "N"'
        type: string
      - name: crumb_label
        label: Breadcrumb text (a short name)
        type: string
      - name: updated
        label: Last updated (shown under the heading)
        type: date
      - name: exams
        label: Exams this is useful for (tags)
        type: string
        list: true
      - name: prev
        label: Previous article (in the series)
        type: object
        fields:
          - name: label
            label: Name to show
            type: string
          - name: href
            label: Link (for example /notes/romantic/)
            type: string
      - name: next
        label: Next article (in the series)
        type: object
        fields:
          - name: label
            label: Name to show
            type: string
          - name: href
            label: Link (for example /notes/modern/)
            type: string
      - name: rail
        label: Show the study boxes at the side?
        type: boolean
        default: true
      - name: body
        label: Article
        type: rich-text

  - name: pages
    label: Site Pages (raw HTML)
    type: collection
    path: ""
    subfolders: true
    format: code
    filename:
      template: "{primary}/index.html"
      field: create
    exclude:
      - 404.html
      - robots.txt
      - sitemap.njk
      - _redirects
      - .pages.yml
      - .gitignore
      - .node-version
      - package.json
      - package-lock.json
      - eleventy.config.js
      - eleventy.article.js

  # Student reviews moved to the Supabase public.reviews table (login-gated, auto-live, 2026-11-11).
  # Students post them at /write-a-review/; there is no CMS collection to edit any more.

  - name: redirects
    label: Redirects (_redirects)
    type: file
    path: _redirects
    format: code

  - name: sitemap
    label: Sitemap
    type: file
    path: sitemap.njk
    format: code

  - name: robots
    label: robots.txt
    type: file
    path: robots.txt
    format: code

  - name: notfound
    label: 404 Page
    type: file
    path: 404.html
    format: code
